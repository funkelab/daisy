[project]
name = "daisy"
version = "2.0.1"
description = "Blockwise task scheduler for processing large volumetric data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "William Patton", email = "wllmpttn24@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "tqdm>=4.65",
    # worker payloads (every distributed worker runs in a subprocess; the
    # v1-compat block wrapper is itself a closure, so this is not optional)
    "cloudpickle>=3",
    # the v1-compat `Block` hands funlib ROIs to process/check functions
    "funlib.geometry>=0.2",
]

[project.optional-dependencies]
# kept as an empty alias for one release; cloudpickle is now a hard dependency
worker-processes = []

[project.urls]
Homepage = "https://github.com/funkelab/daisy"
Documentation = "https://funkelab.github.io/daisy"
Repository = "https://github.com/funkelab/daisy"
Issues = "https://github.com/funkelab/daisy/issues"
Changelog = "https://github.com/funkelab/daisy/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "daisy-py/Cargo.toml"
python-source = "daisy-py/python"
module-name = "daisy._daisy"
features = ["pyo3/extension-module"]
exclude = [
    { path = "experiments/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
]

[tool.ty.src]
include = ["daisy-py/python/daisy", "tests", "benchmarks"]
exclude = []  # only ever shrinks

[dependency-groups]
dev = [
    "cloudpickle>=3",  # lambda/closure support for worker processes
    "filelock>=3.29.0",
    "numpy>=2",  # tests/test_skip_mask.py
    "pytest>=8",
    "pytest-cov>=7",  # 6.x cannot combine worker-process data with branch coverage on
    "pytest-timeout>=2",
]
# ruff runs project-free (`uv run --only-group lint ruff ...`). ty needs the
# built package and the dev group so that `daisy` and the tests' imports
# resolve: CI runs `uv run --group lint ty check`.
lint = [
    "ruff>=0.17.3",
    "ty>=0.0.96",
    "rich>=15.0.0",  # optional import in daisy/logging.py; here so ty resolves it
]
examples = [
    "ipykernel>=7.2.0",
    "lsd-lite>=1.0.0",
    "matplotlib>=3.10.9",
    "mwatershed>=0.5.2",
    "numpy>=2.2.6",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "zarr>=3.1.6",
]
docs = [
    {include-group = "examples"},
    "sphinx>=8",
    "myst-nb>=1.1",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autodoc-typehints>=2.5",
    "sphinx-copybutton>=0.5",
    "jupytext>=1.16",
    "jupyter-cache>=1.0",
    "linkify-it-py>=2.0",
    # tqdm.auto draws notebook widget bars when this is importable; without
    # it, multi-task progress falls back to terminal bars whose cursor
    # movement renders as dozens of partial lines in the executed tutorials.
    "ipywidgets>=8",
]

[tool.pytest.ini_options]
# bare `pytest` must not collect examples/ (stress_test.py runs a pipeline at import)
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.coverage.run]
branch = true
source = ["daisy"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 77
show_missing = true
skip_covered = true
