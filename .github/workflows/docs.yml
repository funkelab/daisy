name: docs

on:
  # Deploy on a version tag, so the site describes the released version.
  # Run by hand (workflow_dispatch) on a pull request's branch to check the
  # build before merging: that builds without deploying. A manual run on main
  # redeploys. Not run on every push or pull request commit.
  # Release order: push the version bump to main as the last commit, wait for
  # tests and benchmark to finish on it, then tag. The tag's deploy then
  # includes a benchmark point measured on the released commit.
  push:
    tags: ["v*"]
  workflow_dispatch:

# Allow only one concurrent deploy at a time per ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Cache jupyter-cache
        uses: actions/cache@v4
        with:
          path: docs/source/.jupyter_cache
          key: jupyter-cache-${{ runner.os }}-${{ hashFiles('examples/*.py', 'daisy-py/python/daisy/**/*.py', 'daisy-core/src/**/*.rs') }}
          restore-keys: |
            jupyter-cache-${{ runner.os }}-

      - name: Build docs
        run: |
          uv run --group docs sphinx-build -b html docs/source docs/_build/html

      # The benchmark action keeps its data and dashboard on gh-pages; the
      # site is deployed from this artifact, so bring them along.
      - run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git checkout origin/gh-pages -- dev/bench 2>/dev/null; then
            mkdir -p docs/_build/html/dev && mv dev/bench docs/_build/html/dev/
          fi
      - name: Upload artifact
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
