# Style and type checks. ruff runs on the lint dependency group only (no
# Rust toolchain / maturin build). ty runs against the built package and
# the dev group, so `daisy` and everything the tests import resolve.
name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff lint
        run: uv run --locked --only-group lint ruff check .
      - name: ruff format
        run: uv run --locked --only-group lint ruff format --check .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: ty type check
        run: uv run --locked --group lint ty check --error-on-warning
