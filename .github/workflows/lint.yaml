# Style and type checks. Runs on the lint dependency group only —
# no Rust toolchain / maturin build needed (`--only-group lint` skips
# installing the project itself; ty resolves daisy._daisy through the
# in-tree stub daisy-py/python/daisy/_daisy.pyi).
name: lint

on:
  push:
    branches:
      - main
      - master
      - v2.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff lint
        run: uv run --only-group lint ruff check .
      - name: ruff format
        run: uv run --only-group lint ruff format --check .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ty type check
        run: uv run --only-group lint ty check daisy-py/python/daisy
